name: samtopup_app
description: Aplikasi beli topup sam topup (khusus pembelian; pengaturan produk dikelola dari web).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.1
  shared_preferences: ^2.2.3
  url_launcher: ^6.3.0
  cached_network_image: ^3.3.1
  qr_flutter: ^4.1.0
  share_plus: ^10.0.0
  path_provider: ^2.1.4
  print_bluetooth_thermal: ^1.1.4
  esc_pos_utils_plus: ^2.0.4
  permission_handler: ^11.3.1
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/

# Ikon aplikasi: jalankan  dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#0B1B3A"
  adaptive_icon_foreground: "assets/icon/icon_fg.png"

# Layar pembuka: jalankan  dart run flutter_native_splash:create
flutter_native_splash:
  color: "#0B1B3A"
  image: assets/icon/splash_logo.png
  android_12:
    color: "#0B1B3A"
    image: assets/icon/splash_logo.png
